server {
    listen 443 ssl http2;
    server_name www.veriktechnologies.com;

    # Configure your existing SSL certificate/key here.

    location /QR-generator/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /qr/ {
        proxy_pass http://127.0.0.1:4000/qr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── QR short-link subdomain ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name qr.veriktechnologies.com;

    # Re-use the same SSL certificate (must cover *.veriktechnologies.com or
    # qr.veriktechnologies.com explicitly). Point to the same cert/key paths.

    # Every path on this subdomain is a QR code short-link — proxy to backend.
    location / {
        proxy_pass http://127.0.0.1:4000/qr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
